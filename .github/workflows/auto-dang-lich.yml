# TỰ ĐỘNG ĐĂNG THEO LỊCH — quét bảng Đăng bài mỗi 15 phút, đăng các dòng đã tới "Lịch đăng bài".
# Không truyền RECORD_ID => quét cả bảng; giữ RESPECT_SCHEDULE mặc định (true) => chỉ đăng dòng đã tới giờ (hoặc không hẹn giờ).
name: auto-dang-lich

# ⛔ NGỪNG TỰ CHẠY từ 14/09/2026: việc đăng Facebook đã chuyển sang repo
#    huyhinhanh2-ux/mentor-club-facebook (workflow dang-bai.yml — đồng hồ Cloudflare tho-mini-cron
#    nhịp :00 bắn sang đó, nút Đăng trong Lark cũng gọi sang đó).
#    Bỏ lịch ở đây để hai hệ không cùng quét bảng 14.3. Giữ workflow_dispatch làm đường LÙI:
#    muốn quay về hệ cũ thì khôi phục 2 dòng schedule dưới đây + xoá GH_REPO_FB/GH_WF_FB trong
#    wrangler.toml của tho-mini-cron rồi deploy lại.
#      schedule:
#        - cron: "*/15 * * * *"
on:
  workflow_dispatch:

# Không cho 2 lượt chạy chồng nhau (cron + nút bấm) → tránh đăng trùng.
# Sự cố thật 2026-07-28: một dòng lên Facebook HAI BÀI giống hệt, cùng giờ, ở cả
# page Bầu lẫn page Newborn. Bảng chỉ có đúng một dòng — hai lượt chạy cùng xử lý
# nó, vì engine chỉ ghi "Thành công" SAU khi đăng xong, còn suốt quãng tải ảnh +
# đẩy lên Facebook thì dòng vẫn hiện "Chờ đăng" cho lượt kia đọc thấy.
# Xếp hàng chờ, KHÔNG hủy giữa chừng: hủy một lượt đang đẩy dở còn tệ hơn — bài
# đã lên Facebook mà trạng thái chưa kịp ghi ⇒ lượt sau đăng lại lần nữa.
# Nhóm phải TRÙNG TÊN với nhóm trong dang-bai.yml (GitHub gom theo TÊN nhóm).
concurrency:
  group: dang-facebook
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Chrome dùng để DÀN TRANG ẢNH (scripts/photobook.js) — xem ghi chú ở dang-bai.yml.
      - name: Bảo đảm có Chrome (dàn trang ảnh)
        continue-on-error: true
        run: |
          if ! command -v google-chrome >/dev/null && ! command -v chromium-browser >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser || true
          fi
          command -v google-chrome || command -v chromium-browser || echo "!! không có Chrome — sẽ đăng kiểu nhiều ảnh như cũ"
      - name: Dang bai toi gio hen (post-feed-api.js)
        env:
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_APP_ID:    ${{ vars.LARK_APP_ID }}
          LARK_APP_TOKEN: ${{ vars.LARK_BASE_ID }}
          LARK_TABLE_ID:  ${{ vars.TABLE_DANGBAI }}
          PAGES_TABLE_ID: ${{ vars.TABLE_PAGES }}
        run: node scripts/post-feed-api.js
