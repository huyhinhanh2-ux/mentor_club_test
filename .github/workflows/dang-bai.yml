name: dang-bai

on:
  repository_dispatch:
    types: [dang-bai]
  workflow_dispatch:

# Xếp hàng chung với auto-dang-lich.yml — hai workflow cùng gọi post-feed-api.js
# trên CÙNG một bảng, chạy chồng là ra bài trùng. Tên nhóm phải trùng nhau.
# cancel-in-progress: false — xem lý do ở auto-dang-lich.yml.
concurrency:
  group: dang-facebook
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Chrome dùng để DÀN TRANG ẢNH (scripts/photobook.js): bài nhiều ảnh được ghép
      # thành MỘT tấm trước khi đăng, để Facebook không tự dựng collage rồi cắt cụt
      # từng ảnh. Runner ubuntu-latest thường có sẵn google-chrome; thiếu thì cài
      # chromium. Cài hỏng cũng không sao — engine tự quay về kiểu đăng nhiều ảnh cũ.
      - name: Bảo đảm có Chrome (dàn trang ảnh)
        continue-on-error: true
        run: |
          if ! command -v google-chrome >/dev/null && ! command -v chromium-browser >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser || true
          fi
          command -v google-chrome || command -v chromium-browser || echo "!! không có Chrome — sẽ đăng kiểu nhiều ảnh như cũ"
      - name: Đăng bài (Hình ảnh -> feed, Video -> Reel)
        env:
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_APP_ID:     ${{ github.event.client_payload.lark_app_id || vars.LARK_APP_ID }}
          LARK_APP_TOKEN:  ${{ github.event.client_payload.base_token || vars.LARK_BASE_ID }}
          LARK_TABLE_ID:   ${{ github.event.client_payload.table_id || vars.TABLE_DANGBAI }}
          PAGES_TABLE_ID:  ${{ github.event.client_payload.pages_table_id || vars.TABLE_PAGES }}
          RESPECT_SCHEDULE: ${{ github.event.client_payload.respect_schedule }}
          RECORD_ID:       ${{ github.event.client_payload.record_id }}
          REEL_CHUNK_MB:   ${{ github.event.client_payload.reel_chunk_mb }}
        run: node scripts/post-feed-api.js ${{ github.event.client_payload.mode }}
